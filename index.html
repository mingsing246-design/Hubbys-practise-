function updateTimer(){let m=Math.floor(time/60),s=time%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function render(){
let x=questions[current];document.getElementById('qno').textContent='Question '+(current+1);
document.getElementById('cat').innerHTML='<span class="badge">'+x.cat+'</span>';document.getElementById('question').textContent=x.q;

x.o.forEach((opt,i)=>{let b=document.createElement('button');b.className='option'+(answers[current]===i?' selected':'');b.textContent=String.fromCharCode(65+i)+'. '+opt;b.onclick=()=>{answers[current]=i;render()};box.appendChild(b)});

}
function nextQ(){if(current<199){current++;render()}}function prevQ(){if(current>0){current--;render()}}
